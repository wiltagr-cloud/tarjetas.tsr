
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de multiplicar</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js" defer></script>
</head>
<body>

    <main class="contenedor" id="contenedor">

        <header>
            <span class="etiqueta">✦ APRENDE A MULTIPLICAR</span>
            <h1>Tablas de <span>multiplicar</span></h1>
            <p class="descripcion">
                Escribe un número y descubre su tabla.
            </p>
        </header>

        <section class="entrada">
            <label for="numero">¿Qué tabla quieres aprender?</label>

            <input
                type="number"
                id="numero"
                min="0"
                max="1000"
                step="1"
                placeholder="Ejemplo: 8"
            >

            <button class="boton" onclick="generarTablas()">
                ▶ PROBAR
            </button>

            <p class="ayuda">Ingresa un número entero y pulsa PROBAR.</p>
        </section>

        <section id="resultado" class="tabla" aria-live="polite"></section>

        <footer>
            <p>✦ Creado por: <strong>Tu Nickname</strong></p>
            <small>HTML + CSS + JavaScript</small>
        </footer>

    </main>

</body>
</html>
